- name: Utilisation des loop avec dictionaire
  hosts: web
  become: True



  vars:
    serveurs:
    - nom: web01
      ip: 192.168.182.129
      role: web

    - nom: db01
      ip: 192.168.182.130
      role: database

    - nom: app01
      ip: 192.168.182.131
      role: application

  tasks:

    - name: Debeuguer les serveurs
      ansible.builtin.debug:
         msg: "Server: {{ item.nom }}"

      when: item.role == "web"

      loop: "{{ serveurs }}"